name: Aqar watch

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Only send a Telegram test message"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: aqar-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check Aqar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then python watch.py --test; else python watch.py; fi

      - name: Save state
        if: ${{ inputs.test != true }}
        run: |
          git config user.name "aqar-watch"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "update listings"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
